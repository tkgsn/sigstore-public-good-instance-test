name: Rekor v2 public-good test

on:
  workflow_dispatch:

permissions: {}

jobs:
  sign-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Create placeholder SNP evidence
        id: snp
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' \
            'TEST ONLY: this is not a genuine AMD SEV-SNP attestation report.' \
            'It exists only to exercise the signed measurement data flow.' \
            > dummy-snp-report.txt

          report_sha256="$(sha256sum dummy-snp-report.txt | cut -d' ' -f1)"
          measurement="$(sha384sum dummy-snp-report.txt | cut -d' ' -f1)"

          [[ "${report_sha256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${measurement}" =~ ^[0-9a-f]{96}$ ]]

          echo "report_sha256=${report_sha256}" >> "${GITHUB_OUTPUT}"
          echo "measurement=${measurement}" >> "${GITHUB_OUTPUT}"

      - name: Create test subject
        env:
          SNP_REPORT_SHA256: ${{ steps.snp.outputs.report_sha256 }}
          SNP_MEASUREMENT: ${{ steps.snp.outputs.measurement }}
        run: |
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit "${GITHUB_SHA}" \
            --arg workflow_ref "${GITHUB_WORKFLOW_REF}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg report_sha256 "${SNP_REPORT_SHA256}" \
            --arg measurement "${SNP_MEASUREMENT}" \
            '{
              purpose: "Rekor v2 placeholder SNP measurement test",
              repository: $repository,
              commit: $commit,
              workflowRef: $workflow_ref,
              runId: $run_id,
              runAttempt: $run_attempt,
              snp: {
                mode: "placeholder",
                reportSha256: $report_sha256,
                measurement: {
                  algorithm: "sha384",
                  value: $measurement
                },
                verification: {
                  result: "test-only",
                  note: "Not verified: generated from a dummy report for workflow testing."
                }
              }
            }' > rekor-v2-test-subject.json

      - name: Verify placeholder measurement is in the subject
        env:
          SNP_REPORT_SHA256: ${{ steps.snp.outputs.report_sha256 }}
          SNP_MEASUREMENT: ${{ steps.snp.outputs.measurement }}
        run: |
          jq -e \
            --arg report_sha256 "${SNP_REPORT_SHA256}" \
            --arg measurement "${SNP_MEASUREMENT}" \
            '
              .snp.mode == "placeholder" and
              .snp.reportSha256 == $report_sha256 and
              .snp.measurement.algorithm == "sha384" and
              .snp.measurement.value == $measurement and
              (.snp.measurement.value | test("^[0-9a-f]{96}$")) and
              .snp.verification.result == "test-only"
            ' rekor-v2-test-subject.json

      - name: Load the TUF-distributed Rekor v2 signing configuration
        run: |
          cosign signing-config create \
            --with-default-rekor-v2 \
            --out signing-config.json

          jq -e '
            .rekorTlogUrls
            | map(select(.majorApiVersion == 2))
            | length > 0
          ' signing-config.json

          jq '{rekorTlogUrls, rekorTlogConfig}' signing-config.json

      - name: Sign the subject and upload the entry to Rekor v2
        run: |
          cosign sign-blob \
            --yes \
            --signing-config signing-config.json \
            --bundle rekor-v2-test.sigstore.json \
            rekor-v2-test-subject.json

      - name: Verify the bundle and GitHub Actions identity
        run: |
          expected_identity="${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}"

          cosign verify-blob \
            --bundle rekor-v2-test.sigstore.json \
            --certificate-identity "${expected_identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            rekor-v2-test-subject.json

      - name: Show transparency-log evidence
        run: |
          jq -e '.verificationMaterial.tlogEntries | length > 0' \
            rekor-v2-test.sigstore.json

          jq '.verificationMaterial.tlogEntries[] | {
            logIndex,
            integratedTime,
            logId,
            inclusionPromise,
            inclusionProof
          }' rekor-v2-test.sigstore.json

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: rekor-v2-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rekor-v2-test-subject.json
            rekor-v2-test.sigstore.json
            signing-config.json
            dummy-snp-report.txt
          if-no-files-found: error
          retention-days: 30
